<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brawl Stars 3D Browser Game</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
      color: white;
    }
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      box-sizing: border-box;
      z-index: 5;
      background: linear-gradient(180deg, rgba(0,0,0,0.45), transparent);
    }
    .panel {
      background: rgba(10, 20, 36, 0.82);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(8px);
    }
    #controls {
      position: fixed;
      bottom: 14px;
      left: 14px;
      z-index: 5;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      pointer-events: auto;
      cursor: pointer;
      border: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: #ffcb3d;
      color: #111;
      font-weight: bold;
      margin-right: 6px;
      margin-top: 6px;
    }
    button:hover { background: #ffd96b; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <div id="heroName">Selected: Shelly</div>
      <div id="stats">Health: 100 | Score: 0</div>
    </div>
    <div class="panel" id="brawlers">
      <button data-name="Shelly">Shelly</button>
      <button data-name="Colt">Colt</button>
      <button data-name="Spike">Spike</button>
      <button data-name="Brock">Brock</button>
    </div>
  </div>
  <div id="controls" class="panel">
    Move: WASD / Arrow keys<br />
    Aim: Mouse<br />
    Shoot: Left click<br />
    Goal: survive and defeat the enemy brawlers
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050816);
    scene.fog = new THREE.Fog(0x050816, 16, 70);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 14, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x9fb3ff, 0.9);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(12, 20, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(60, 1, 60),
      new THREE.MeshStandardMaterial({ color: 0x1f2c3d, roughness: 0.9 })
    );
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(12, 0.2, 16, 80),
      new THREE.MeshBasicMaterial({ color: 0xffd54f })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.05;
    scene.add(ring);

    const arenaObjects = [];
    const obstacleMaterial = new THREE.MeshStandardMaterial({ color: 0x2b3a55, roughness: 0.8, metalness: 0.3 });
    const positions = [
      [-10, 0, -10], [10, 0, 10], [8, 0, -8], [-8, 0, 8], [-12, 0, 3], [12, 0, -3]
    ];
    positions.forEach(([x, y, z]) => {
      const box = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), obstacleMaterial);
      box.position.set(x, 1.5, z);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
      arenaObjects.push(box);
    });

    const brawlers = {
      Shelly: { color: 0xff6b6b, weapon: 'shotgun', speed: 5.5 },
      Colt: { color: 0x4fc3f7, weapon: 'pistol', speed: 6.2 },
      Spike: { color: 0x8bc34a, weapon: 'spike', speed: 4.6 },
      Brock: { color: 0xffb300, weapon: 'rocket', speed: 4.8 }
    };

    const heroNameEl = document.getElementById('heroName');
    const statsEl = document.getElementById('stats');
    const buttons = document.querySelectorAll('button[data-name]');

    const heroGroup = new THREE.Group();
    scene.add(heroGroup);

    function createBrawler(name, x, z, isPlayer = false) {
      const data = brawlers[name] || brawlers.Shelly;
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.userData = { name, health: 100, maxHealth: 100, speed: data.speed, damage: 18, isPlayer, color: data.color, weapon: data.weapon, alive: true };

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, 1.6, 1.3),
        new THREE.MeshStandardMaterial({ color: data.color, emissive: data.color, emissiveIntensity: 0.15 })
      );
      body.position.y = 1.2;
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 20, 20),
        new THREE.MeshStandardMaterial({ color: 0xfff8e1 })
      );
      head.position.y = 2.35;
      head.castShadow = true;
      group.add(head);

      const weapon = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.3, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x111827 })
      );
      weapon.position.set(0.8, 1.2, 0.5);
      group.add(weapon);

      const healthBar = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, 0.12, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x27ae60 })
      );
      healthBar.position.set(0, 3.1, 0);
      healthBar.name = 'healthBar';
      group.add(healthBar);
      group.userData.healthBar = healthBar;

      const label = makeLabel(name);
      label.position.set(0, 3.5, 0);
      group.add(label);

      return group;
    }

    function makeLabel(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 26px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(text, 128, 38);
      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(4, 1, 1);
      return sprite;
    }

    const player = createBrawler('Shelly', 0, 0, true);
    heroGroup.add(player);
    const enemies = [];
    for (let i = 0; i < 3; i++) {
      const x = i % 2 === 0 ? 14 : -14;
      const z = i === 0 ? 12 : i === 1 ? -12 : 0;
      const enemy = createBrawler(['Colt', 'Spike', 'Brock'][i], x, z, false);
      scene.add(enemy);
      enemies.push(enemy);
    }

    const bullets = [];
    const pointer = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const pointOnGround = new THREE.Vector3();
    let shootCooldown = 0;
    let score = 0;

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    window.addEventListener('mousemove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      raycaster.ray.intersectPlane(groundPlane, pointOnGround);
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        shootAt(pointOnGround);
      }
    });

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.name;
        heroNameEl.textContent = `Selected: ${name}`;
        const data = brawlers[name];
        player.userData.name = name;
        player.userData.speed = data.speed;
        player.userData.color = data.color;
        player.userData.weapon = data.weapon;
        player.children[0].material.color.set(data.color);
        player.children[0].material.emissive.set(data.color);
        player.children[0].material.needsUpdate = true;
      });
    });

    function shootAt(target) {
      if (shootCooldown > 0 || !player.userData.alive) return;
      const origin = player.position.clone().add(new THREE.Vector3(0, 1.2, 0));
      const dir = target.clone().sub(origin);
      if (dir.lengthSq() < 0.0001) return;
      dir.normalize();
      const bullet = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 0.8),
        new THREE.MeshBasicMaterial({ color: 0xfff7b2 })
      );
      bullet.position.copy(origin);
      bullet.userData = { velocity: dir.multiplyScalar(20), damage: 18 };
      scene.add(bullet);
      bullets.push(bullet);
      shootCooldown = 0.16;
    }

    function updatePlayer(delta) {
      const move = new THREE.Vector3();
      if (keys['w'] || keys['arrowup']) move.z -= 1;
      if (keys['s'] || keys['arrowdown']) move.z += 1;
      if (keys['a'] || keys['arrowleft']) move.x -= 1;
      if (keys['d'] || keys['arrowright']) move.x += 1;
      if (move.lengthSq() > 0) {
        move.normalize();
        player.position.x += move.x * player.userData.speed * delta;
        player.position.z += move.z * player.userData.speed * delta;
        player.position.x = THREE.MathUtils.clamp(player.position.x, -24, 24);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -24, 24);
      }
      if (pointOnGround && pointOnGround.x !== 0) {
        const lookAt = new THREE.Vector3(pointOnGround.x, player.position.y, pointOnGround.z);
        player.lookAt(lookAt);
      }
      camera.position.lerp(new THREE.Vector3(player.position.x + 6, 14, player.position.z + 15), 0.08);
      camera.lookAt(player.position.x, 1.2, player.position.z);
    }

    function updateEnemies(delta) {
      enemies.forEach((enemy) => {
        if (!enemy.userData.alive) return;
        const toPlayer = player.position.clone().sub(enemy.position);
        const dist = toPlayer.length();
        if (dist > 0.1) {
          toPlayer.normalize();
          enemy.position.addScaledVector(toPlayer, Math.min(enemy.userData.speed * delta, dist > 4 ? 1.2 : 0.6));
          enemy.lookAt(player.position.x, 1.2, player.position.z);
        }
        if (dist < 8 && Math.random() < 0.01) {
          const bullet = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.2, 0.8),
            new THREE.MeshBasicMaterial({ color: 0xff7c7c })
          );
          bullet.position.copy(enemy.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
          const dir = player.position.clone().sub(enemy.position).normalize();
          bullet.userData = { velocity: dir.multiplyScalar(12), damage: 14, fromEnemy: true };
          scene.add(bullet);
          bullets.push(bullet);
        }
      });
    }

    function updateBullets(delta) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.addScaledVector(b.userData.velocity, delta);
        b.userData.life = (b.userData.life || 1.2) - delta;
        if (b.userData.life <= 0) {
          scene.remove(b);
          bullets.splice(i, 1);
          continue;
        }
        if (b.position.y < 0.5) {
          scene.remove(b);
          bullets.splice(i, 1);
          continue;
        }
        if (checkHit(b)) {
          scene.remove(b);
          bullets.splice(i, 1);
        }
      }
    }

    function checkHit(bullet) {
      const target = bullet.userData.fromEnemy ? player : getClosestEnemy(bullet.position);
      if (!target) return false;
      const distance = bullet.position.distanceTo(target.position);
      if (distance < 1.2) {
        target.userData.health -= bullet.userData.damage;
        if (target === player) {
          player.userData.health = Math.max(0, player.userData.health - bullet.userData.damage);
          if (player.userData.health <= 0) {
            player.userData.alive = false;
            player.children[0].material.color.set(0x444444);
            player.children[0].material.needsUpdate = true;
          }
        } else {
          score += 25;
          if (target.userData.health <= 0) {
            target.userData.alive = false;
            target.visible = false;
          }
        }
        updateHud();
        return true;
      }
      return false;
    }

    function getClosestEnemy(position) {
      let closest = null;
      let minDist = Infinity;
      enemies.forEach((enemy) => {
        if (!enemy.userData.alive) return;
        const dist = enemy.position.distanceTo(position);
        if (dist < minDist) {
          minDist = dist;
          closest = enemy;
        }
      });
      return closest;
    }

    function updateHud() {
      statsEl.textContent = `Health: ${Math.max(0, player.userData.health)} | Score: ${score}`;
      const healthScale = Math.max(0.04, player.userData.health / 100);
      player.userData.healthBar.scale.set(healthScale * 1.3, 0.12, 0.12);
      player.userData.healthBar.material.color.set(player.userData.health > 40 ? 0x27ae60 : 0xe74c3c);
      player.userData.healthBar.material.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(0.03, 0.016);
      shootCooldown = Math.max(0, shootCooldown - delta);
      if (player.userData.alive) {
        updatePlayer(delta);
        updateEnemies(delta);
      }
      updateBullets(delta);
      updateHud();
      renderer.render(scene, camera);
    }

    updateHud();
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
