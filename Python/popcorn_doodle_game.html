<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popcorn Doodle Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #ffeb8c 0%, #ffb347 55%, #ff7f50 100%);
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 6px solid #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      background: linear-gradient(180deg, #87ceeb 0%, #4fa3d1 100%);
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(0,0,0,0.35);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      backdrop-filter: blur(6px);
    }
    .info {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.35);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      backdrop-filter: blur(6px);
    }
    .warning {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.8);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      animation: flash 0.3s;
    }
    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="hud">Dodged: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
  <div class="info">Move your character to avoid the falling kernels!<br/>Dodge them to earn points.</div>
  <canvas id="gameCanvas" width="900" height="520"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');

    const width = canvas.width;
    const height = canvas.height;

    let score = 0;
    let lives = 3;
    let gameOver = false;
    let spawnTimer = 0;
    let popTimer = 0;

    const popcorns = [];
    const player = { x: width / 2, y: height - 70, radius: 34 };
    const keys = {};

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createPopcorn(type = 'good') {
      const size = type === 'burnt' ? rand(18, 28) : rand(20, 36);
      return {
        x: rand(size, width - size),
        y: -size,
        vy: rand(1.5, 3.8),
        size,
        type,
        popped: false,
        spin: rand(0, Math.PI * 2),
        rotationSpeed: rand(-0.08, 0.08)
      };
    }

    function spawnKernel() {
      const type = Math.random() < 0.18 ? 'burnt' : 'good';
      popcorns.push(createPopcorn(type));
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff3cd';
      ctx.beginPath();
      ctx.arc(-8, -10, 9, 0, Math.PI * 2);
      ctx.arc(8, -10, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(-8, -10, 3, 0, Math.PI * 2);
      ctx.arc(8, -10, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawKernel(k) {
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.spin);
      ctx.fillStyle = k.type === 'burnt' ? '#8b4b2a' : '#f8f1c6';
      ctx.beginPath();
      ctx.arc(0, 0, k.size, 0, Math.PI * 2);
      ctx.fill();
      if (!k.popped) {
        ctx.strokeStyle = k.type === 'burnt' ? '#6d2f16' : '#d8c56a';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = '#ff8c00';
        ctx.beginPath();
        ctx.arc(-k.size * 0.25, -k.size * 0.25, k.size * 0.4, 0, Math.PI * 2);
        ctx.arc(k.size * 0.25, -k.size * 0.25, k.size * 0.4, 0, Math.PI * 2);
        ctx.arc(0, k.size * 0.15, k.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function update() {
      if (gameOver) return;

      // Handle arrow key movement
      const moveSpeed = 6;
      if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(player.radius, player.x - moveSpeed);
      if (keys['ArrowRight'] || keys['d']) player.x = Math.min(width - player.radius, player.x + moveSpeed);
      if (keys['ArrowUp'] || keys['w']) player.y = Math.max(player.radius, player.y - moveSpeed);
      if (keys['ArrowDown'] || keys['s']) player.y = Math.min(height - player.radius, player.y + moveSpeed);

      spawnTimer += 1 / 60;
      popTimer += 1 / 60;
      if (spawnTimer > 0.64) {
        spawnKernel();
        spawnTimer = 0;
      }

      for (let i = popcorns.length - 1; i >= 0; i--) {
        const k = popcorns[i];
        k.y += k.vy;
        k.spin += k.rotationSpeed;

        // Check collision with player
        if (!k.popped && k.y + k.size > player.y - player.radius && k.y - k.size < player.y + player.radius && Math.abs(k.x - player.x) < player.radius + k.size) {
          lives -= 1;
          k.popped = true;
          showHitWarning();
        }

        if (k.popped) {
          k.size *= 0.96;
          if (k.size < 1.5) popcorns.splice(i, 1);
        } else if (k.y - k.size > height) {
          // Kernel fell off - player successfully dodged it
          score += 1;
          popcorns.splice(i, 1);
        }
      }

      if (lives <= 0) {
        gameOver = true;
      }

      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    function showHitWarning() {
      const warning = document.createElement('div');
      warning.className = 'warning';
      warning.textContent = '✗ HIT!';
      document.body.appendChild(warning);
      setTimeout(() => warning.remove(), 300);
    }

    function drawBackground() {
      ctx.clearRect(0, 0, width, height);
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, '#87ceeb');
      sky.addColorStop(1, '#4fa3d1');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#7fdc6f';
      ctx.fillRect(0, height - 90, width, 90);

      for (let i = 0; i < 18; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#ffe082' : '#ffffff';
        ctx.beginPath();
        ctx.arc(40 + i * 46, 60 + (i % 3) * 12, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      drawBackground();
      popcorns.forEach(drawKernel);
      drawPlayer();

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 44px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', width / 2, height / 2 - 10);
        ctx.font = '28px Arial';
        ctx.fillText(`Final Score: ${score}`, width / 2, height / 2 + 32);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    gameLoop();
  </script>
</body>
</html>
